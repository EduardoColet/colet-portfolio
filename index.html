<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Eduardo Colet — Desenvolvedor Web & Mobile</title>
    <meta name="description" content="Portfólio de Eduardo Colet: desenvolvedor web e mobile, Flutter, TypeScript e apps, APIs, nuvem e visão computacional." />
    <script>
      // Aplica o tema antes do primeiro paint (evita piscar).
      try {
        var p = localStorage.getItem('theme') || 'system'
        var dark = p === 'dark' || (p === 'system' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
    <style>
      /* CSS crítico: em dev o Vite injeta o CSS via JS, então sem isto a página aparece
         sem estilo por um instante (ícones gigantes). O style.css torna o body visível. */
      html { background: #0c0b0f; }
      html[data-theme='light'] { background: #f4f3f7; }
      body { margin: 0; visibility: hidden; }
    </style>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='40' fill='%23a385ff'/></svg>" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="loader" aria-hidden="true">
      <div class="loader__icon">
        <svg width="80" height="64" viewBox="0 0 80 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect class="loader__frame" x="2" y="2" width="76" height="60" rx="7" />
          <path class="loader__frame" d="M2 14h76" />
          <g class="loader__dots"><circle cx="9" cy="8" r="1.3" /><circle cx="15" cy="8" r="1.3" /><circle cx="21" cy="8" r="1.3" /></g>
          <path class="loader__prompt" d="m12 25 6 5-6 5" />
          <path class="loader__line loader__line--1" d="M24 30h26" />
          <path class="loader__line loader__line--2" d="M12 43h20" />
          <path class="loader__line loader__line--3" d="M12 53h34" />
          <rect class="loader__caret" x="50" y="48" width="5" height="9" rx="1" />
        </svg>
        <span class="loader__percent">000</span>
      </div>
    </div>
    <div class="progress" aria-hidden="true"></div>
    <div class="cursor" aria-hidden="true"></div>

    <header class="nav"></header>

    <main id="app"></main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
